# Builds the site and uploads dist/ to the UNF cPanel host that serves ite.domains.unf.edu.
# Needs repo secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Optional repo variable FTP_SERVER_DIR (must end with /), e.g. public_html/. Defaults to the FTP account's root.
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would change on the server without uploading
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
